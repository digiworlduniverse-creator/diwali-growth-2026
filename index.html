<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Iss Diwali, digital game badlo. Join DiGi World Universe's WhatsApp launch group and unlock smarter digital growth.">
<title>Diwali Digital Growth | DiGi World Universe</title>
<style>
:root {
  --navy: #050b14;
  --dark-blue: #0b172a;
  --blue: #102d58;
  --cyan: #55e6ff;
  --gold: #ffc86a;
  --orange: #ff8b2b;
  --deep-diwali-red: #4a0d0a;
  --diwali-glow: rgba(255, 139, 43, 0.35);
  --white: #f8fbff;
  --muted: #a4b3ca;
  --glass: rgba(11, 23, 42, 0.72);
  --glass-border: rgba(255, 200, 106, 0.22);
}

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  background: var(--navy);
  color: var(--white);
  font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  overflow-x: hidden;
  position: relative;
}

/* Background Canvas & Video Styling with Diwali Theme */
#bg-canvas {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: -1;
}

.video-container {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  overflow: hidden;
  z-index: -3;
}

.video-container video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: brightness(0.35) contrast(1.2) saturate(1.2) hue-rotate(-5deg);
  transform: scale(1.03);
}

.video-overlay {
  position: fixed;
  inset: 0;
  background: 
    radial-gradient(circle at 50% 30%, rgba(255, 139, 43, 0.25), rgba(74, 13, 10, 0.4) 40%, transparent 70%),
    radial-gradient(circle at 20% 80%, rgba(255, 200, 106, 0.15), transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(85, 230, 255, 0.1), transparent 40%),
    linear-gradient(180deg, rgba(5, 11, 20, 0.65) 0%, rgba(74, 13, 10, 0.3) 50%, rgba(5, 11, 20, 0.85) 100%);
  pointer-events: none;
  z-index: -2;
  box-shadow: inset 0 0 100px rgba(255, 139, 43, 0.1);
}

/* Navigation */
nav {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px 6%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: relative;
  z-index: 10;
}

.brand-container {
  display: flex;
  align-items: center;
  gap: 12px;
}

.official-logo {
  height: 52px;
  width: auto;
  filter: drop-shadow(0 0 15px rgba(255, 139, 43, 0.6));
}

.nav-tag {
  color: var(--gold);
  font-size: 0.78rem;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  background: linear-gradient(90deg, rgba(255, 139, 43, 0.15), rgba(255, 200, 106, 0.15));
  border: 1px solid var(--gold);
  padding: 6px 16px;
  border-radius: 100px;
  font-weight: 700;
  box-shadow: 0 0 15px rgba(255, 139, 43, 0.3);
}

/* Hero Section */
.hero {
  min-height: 85vh;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 40px 6% 60px;
  position: relative;
  z-index: 2;
}

.hero-inner {
  max-width: 920px;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  border: 1px solid var(--glass-border);
  background: linear-gradient(135deg, rgba(255, 139, 43, 0.2), rgba(255, 200, 106, 0.1));
  backdrop-filter: blur(12px);
  border-radius: 100px;
  padding: 8px 20px;
  color: var(--gold);
  font-size: 0.85rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  box-shadow: 0 0 30px rgba(255, 139, 43, 0.3);
}

h1 {
  font-size: clamp(2.8rem, 7vw, 5.5rem);
  line-height: 1.05;
  letter-spacing: -.045em;
  margin: 28px 0 20px;
  font-weight: 900;
}

h1 .highlight {
  background: linear-gradient(90deg, #ffbc3b, #ffda8b, #ff7700, #ffbc3b);
  background-size: 300% auto;
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  animation: goldShimmer 6s linear infinite;
  filter: drop-shadow(0 0 25px rgba(255, 139, 43, 0.5));
}

@keyframes goldShimmer {
  0% { background-position: 0% 50%; }
  100% { background-position: 300% 50%; }
}

.hero p {
  font-size: clamp(1.05rem, 2vw, 1.3rem);
  line-height: 1.7;
  color: var(--muted);
  max-width: 720px;
  margin: 0 auto 36px;
}

/* Buttons & CTA with Diwali Glow */
.cta {
  display: inline-flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  background: linear-gradient(135deg, #ffaa3a, var(--orange), #d95304);
  color: #1a0800;
  font-weight: 800;
  text-decoration: none;
  padding: 20px 36px;
  border-radius: 18px;
  font-size: 1.15rem;
  box-shadow: 0 0 45px rgba(255, 139, 43, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.5);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  border: none;
  cursor: pointer;
  position: relative;
}

.cta:hover {
  transform: translateY(-5px) scale(1.02);
  box-shadow: 0 0 60px rgba(255, 139, 43, 0.9), 0 0 20px rgba(255, 200, 106, 0.4);
}

.micro {
  margin-top: 16px;
  color: var(--muted);
  font-size: 0.85rem;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
}

/* Countdown Section */
.countdown-container {
  background: linear-gradient(135deg, rgba(11, 23, 42, 0.8), rgba(74, 13, 10, 0.4));
  border: 1px solid var(--gold);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 28px;
  max-width: 680px;
  margin: 20px auto 40px;
  box-shadow: 0 10px 40px rgba(255, 139, 43, 0.25), inset 0 0 20px rgba(255, 200, 106, 0.1);
}

.countdown-title {
  font-size: 0.95rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
  font-weight: 800;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}

.countdown-title::before, .countdown-title::after {
  content: "✧";
  color: var(--orange);
}

.timer-boxes {
  display: flex;
  justify-content: center;
  gap: 18px;
}

.timer-box {
  background: radial-gradient(circle at top, rgba(255, 139, 43, 0.15), rgba(5, 11, 20, 0.8));
  border: 1px solid rgba(255, 200, 106, 0.3);
  border-radius: 16px;
  padding: 16px 20px;
  min-width: 88px;
  box-shadow: inset 0 2px 6px rgba(255, 255, 255, 0.1);
}

.timer-num {
  font-size: 2.2rem;
  font-weight: 900;
  color: #ffe09a;
  text-shadow: 0 0 15px rgba(255, 200, 106, 0.6);
}

.timer-label {
  font-size: 0.75rem;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 4px;
}

/* Interactive Calculator */
.calc-section {
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 6%;
}

.calc-card {
  background: var(--glass);
  border: 1px solid var(--glass-border);
  backdrop-filter: blur(20px);
  border-radius: 28px;
  padding: 40px;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

.calc-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
  align-items: center;
}

.calc-input label {
  display: block;
  font-weight: 700;
  font-size: 1.1rem;
  margin-bottom: 16px;
  color: var(--white);
}

.calc-slider {
  width: 100%;
  height: 8px;
  background: rgba(255,255,255,0.1);
  border-radius: 4px;
  outline: none;
  -webkit-appearance: none;
  accent-color: var(--orange);
  cursor: pointer;
}

.calc-slider::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 15px var(--orange);
  cursor: pointer;
  transition: transform 0.1s ease;
}

.calc-slider::-webkit-slider-thumb:hover {
  transform: scale(1.2);
}

.calc-result {
  text-align: center;
  background: linear-gradient(135deg, rgba(255, 139, 43, 0.15), rgba(11, 23, 42, 0.9));
  border: 1px solid var(--gold);
  padding: 32px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(255, 139, 43, 0.2);
}

.calc-result-num {
  font-size: 3rem;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 20px rgba(255, 200, 106, 0.8);
  margin: 10px 0;
}

/* Feature Cards Strip */
.strip {
  max-width: 1080px;
  margin: 60px auto;
  padding: 0 6%;
}

.strip-card {
  background: var(--glass);
  border: 1px solid rgba(255, 200, 106, 0.25);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 36px clamp(24px, 5vw, 48px);
  display: flex;
  gap: 28px;
  align-items: flex-start;
  margin-bottom: 24px;
  position: relative;
  box-shadow: 0 15px 35px rgba(0,0,0,0.4);
}

.icon {
  flex: 0 0 60px;
  height: 60px;
  border-radius: 16px;
  display: grid;
  place-items: center;
  font-size: 1.8rem;
  background: linear-gradient(135deg, rgba(255, 139, 43, 0.2), rgba(255, 200, 106, 0.1));
  border: 1px solid rgba(255, 200, 106, 0.4);
  box-shadow: 0 0 20px rgba(255, 139, 43, 0.3);
}

.strip-card h2 {
  font-size: clamp(1.3rem, 2.8vw, 1.8rem);
  margin: 0 0 12px;
  letter-spacing: -0.02em;
}

.strip-card p {
