<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>Diwali Game Badlo | DiGi World Universe</title>
<meta name="description" content="Celebrate Diwali with exclusive digital marketing and AI automation offers from DiGi World Universe. Limited to 10 clients for one month.">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --navy:#080d20;
  --navy2:#101a35;
  --gold:#ffd477;
  --gold2:#ffac36;
  --orange:#ff752e;
  --white:#fffaf0;
  --muted:#b9bfd0;
}
* {box-sizing:border-box;margin:0;padding:0}
html {scroll-behavior:smooth}
body {
  background:var(--navy);
  color:var(--white);
  font-family:'Outfit',sans-serif;
  overflow-x:hidden;
}
a {text-decoration:none;color:inherit}
.container {width:min(1200px,91%);margin:auto}

/* HERO SECTION */
.hero {
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 70%,rgba(255,130,34,.15),transparent 50%),
    radial-gradient(ellipse at 90% 10%,rgba(96,71,180,.25),transparent 35%),
    linear-gradient(145deg,#080d20,#121b36 55%,#080d20);
}
.hero:before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,215,130,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,215,130,.06) 1px,transparent 1px);
  background-size:65px 65px;
}
.glow {
  position:absolute;
  width:450px;height:450px;
  border-radius:50%;
  filter:blur(100px);
  pointer-events:none;
}
.glow.one {background:#ff8a25;opacity:.13;top:25%;left:-200px}
.glow.two {background:#744bff;opacity:.18;right:-200px;top:10%}

/* PARTICLES */
.particles {
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.particle {
  position:absolute;
  width:3px;height:3px;
  background:#ffdb91;
  border-radius:50%;
  box-shadow:0 0 12px 3px rgba(255,190,80,.5);
  animation:rise linear infinite;
}
@keyframes rise {
  0% {transform:translateY(100vh) scale(.5);opacity:0}
  15% {opacity:1}
  85% {opacity:.7}
  100% {transform:translateY(-100px) scale(1.5);opacity:0}
}

/* NAVBAR */
.navbar {
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 0;
}
.logo-container {
  display: flex;
  align-items: center;
  gap: 15px;
}
.logo-img {
  height: 48px;
  object-fit: contain;
}

.nav-tag {
  padding: 10px 17px;
  border: 1px solid rgba(255, 210, 120, 0.4);
  border-radius: 30px;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 2px;
  background: rgba(255, 172, 54, 0.05);
}

/* HERO CONTAINER */
.hero-content {
  position: relative;
  z-index: 2;
  text-align: center;
  padding: 60px 0 50px;
  max-width: 900px;
  margin: 0 auto;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 4px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 18px;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(48px, 8vw, 96px);
  line-height: 1.05;
  margin: 15px 0 25px;
  text-shadow: 0 5px 40px rgba(255, 172, 54, 0.15);
}

.hero h1 span {
  display: block;
  background: linear-gradient(90deg, #fff1c4, #ffba4d, #fff0b2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-description {
  color: #c8cede;
  font-size: 17px;
  line-height: 1.8;
  max-width: 680px;
  margin: 0 auto 30px;
}

.limited {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 30px;
  padding: 11px 20px;
  border: 1px solid rgba(255, 196, 90, 0.55);
  border-radius: 40px;
  background: rgba(255, 166, 48, 0.09);
  color: #ffdb96;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}
.limited i {
  width: 8px;height: 8px;
  background: #ff9b3d;
  border-radius: 50%;
  box-shadow: 0 0 12px #ff9b3d;
}

.hero-buttons {
  display: flex;
  justify-content: center;
  gap: 15px;
  flex-wrap: wrap;
  margin-bottom: 40px;
}

.btn {
  padding: 15px 27px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 800;
  transition: .3s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.btn-gold {
  color: #241403;
  background: linear-gradient(110deg,#ffe6a0,#ffae35);
  box-shadow: 0 10px 35px rgba(255,163,48,.2);
}
.btn-outline {
  border: 1px solid rgba(255,215,140,.5);
  color: #ffe3ae;
}
.btn:hover {transform: translateY(-4px); filter: brightness(1.1)}

/* DIYA VISUALS */
.diya-row {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: end;
  gap: clamp(30px, 7vw, 90px);
  margin: 20px auto 10px;
}
.diya {
  width: 55px;
  height: 25px;
  position: relative;
  background: linear-gradient(180deg,#ffcf76,#a94b16);
  border-radius: 10px 10px 50% 50%;
  box-shadow: 0 12px 35px rgba(255,127,24,.22);
}
.diya:before {
  content: "";
  position: absolute;
  width: 15px; height: 24px;
  left: 50%; top: -23px;
  transform: translateX(-50%);
  border-radius: 50% 50% 45% 45%;
  background: radial-gradient(ellipse at 40% 65%,#fff8b3 0%,#ffb02d 40%,#ff5b18 75%);
  filter: drop-shadow(0 0 12px #ff9b30);
  animation: flame .7s ease-in-out infinite alternate;
}
.diya:after {
  content: "";
  position: absolute;
  left: 50%; top: -6px;
  width: 30px; height: 15px;
  transform: translateX(-50%);
  background: rgba(255,173,49,.25);
  filter: blur(10px);
}
@keyframes flame {
  from {transform:translateX(-50%) scale(.9) rotate(-4deg)}
  to {transform:translateX(-50%) scale(1.12) rotate(4deg)}
}

/* OFFER SECTION */
.offers {
  position: relative;
  padding: 110px 0;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,171,48,.08),transparent 50%),
    #080d20;
}
.section-title {text-align: center; margin-bottom: 55px}
.section-title .eyebrow {margin-bottom: 18px}
.section-title h2 {
  font-family: 'Playfair Display',serif;
  font-size: clamp(35px, 5vw, 60px);
  margin-bottom: 15px;
}
.section-title p {color: var(--muted); line-height: 1.7}

/* DISCOUNT CARDS */
.discount-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 22px;
  max-width: 850px;
  margin: 0 auto 65px;
}
.discount-card {
  padding: 32px;
  text-align: center;
  border: 1px solid rgba(255,198,104,.25);
  border-radius: 20px;
  background: linear-gradient(145deg,#17223e,#0c142a);
  box-shadow: 0 15px 45px rgba(0,0,0,.2);
  transition: .35s;
}
.discount-card:hover {transform: translateY(-7px); border-color: #ffca72}
.discount-card .icon {font-size: 35px; margin-bottom: 15px}
.discount-card h3 {font-size: 19px; margin-bottom: 13px}
.discount-card strong {
  display: block;
  font-size: clamp(35px, 5vw, 50px);
  color: var(--gold);
}
.discount-card p {color: var(--muted); font-size: 13px; margin-top: 8px}

/* PRICING */
.pricing-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px;
}
.price-card {
  position: relative;
  overflow: hidden;
  padding: 34px 27px;
  border: 1px solid rgba(255,202,111,.22);
  border-radius: 22px;
  background: linear-gradient(145deg,#17233f,#0c1428 75%);
  transition: transform .4s, border-color .4s;
}
.price-card:hover {
  transform: translateY(-9px);
  border-color: rgba(255,205,113,.75);
}
.price-card.featured {
  border: 1px solid #e8b75c;
  background:
    radial-gradient(ellipse at 50% 0%,rgba(255,171,48,.14),transparent 60%),
    linear-gradient(145deg,#25304c,#10172d);
  box-shadow: 0 15px 50px rgba(255,162,45,.09);
}
.popular {
  position: absolute;
  right: -36px; top: 18px;
  background: linear-gradient(90deg,#ffb63c,#ffe6a0);
  color: #291807;
  font-size: 9px;
  letter-spacing: 1px;
  font-weight: 900;
  padding: 8px 42px;
  transform: rotate(38deg);
}
.price-icon {font-size: 32px; margin-bottom: 20px}
.price-card h3 {font-size: 19px; margin-bottom: 22px}
.old-price {
  color: #929bb0;
  text-decoration: line-through;
  font-size: 16px;
}
.new-price {
  display: block;
  color: var(--gold);
  font-size: clamp(33px, 4vw, 44px);
  font-weight: 800;
  margin: 5px 0;
  letter-spacing: -1px;
}
.saving {
  color: #9fe6a1;
  font-size: 12px;
  margin-bottom: 24px;
}
.price-line {
  height: 1px;
  background: rgba(255,255,255,.1);
  margin: 20px 0;
}
.price-card .btn {width: 100%; padding: 13px 10px}

/* LIMITED OFFER */
.limited-banner {
  position: relative;
  overflow: hidden;
  margin-top: 65px;
  padding: 48px 25px;
  text-align: center;
  border: 1px solid rgba(255,205,120,.45);
  border-radius: 24px;
  background:
    radial-gradient(ellipse at center,rgba(255,160,45,.17),transparent 70%),
    linear-gradient(110deg,#17223c,#11172b);
}
.limited-banner h2 {
  font-family: 'Playfair Display',serif;
  font-size: clamp(35px, 5vw, 57px);
  color: var(--gold);
  margin-bottom: 12px;
}
.limited-banner p {color: #d2d6e0; line-height: 1.8}
.slot-count {
  font-size: 13px;
  letter-spacing: 2px;
  color: #ffdc9c;
  margin: 22px 0;
  font-weight: 800;
}
.limited-banner .btn {margin-top: 8px}

/* FLOATING WHATSAPP BUTTON */
.whatsapp-float {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background-color: #25d366;
  color: #fff;
  width: 60px;
  height: 60px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  box-shadow: 0 4px 20px rgba(37, 211, 102, 0.5);
  z-index: 1000;
  transition: transform 0.3s ease, background-color 0.3s ease;
}
.whatsapp-float:hover {
  transform: scale(1.1);
  background-color: #22bf5b;
}

/* FOOTER */
footer {
  padding: 40px 0;
  background: #060a17;
  border-top: 1px solid rgba(255,207,125,.15);
  text-align: center;
  color: #8f9ab0;
  font-size: 12px;
  line-height: 2;
}
.footer-logo-wrap {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 15px;
}
.footer-logo-img {
  height: 32px;
  object-fit: contain;
}
.footer-brand {
  font-family: 'Playfair Display',serif;
  font-weight: 800;
  font-size: 16px;
  color: var(--gold);
}

/* RESPONSIVE MEDIA QUERIES */
@media(max-width: 800px) {
  .pricing-grid {grid-template-columns: 1fr; max-width: 480px; margin: auto}
  .hero {min-height: auto}
}

@media(max-width: 550px) {
  .logo-img {height: 38px;}
  .nav-tag {font-size: 9px; padding: 9px 11px; letter-spacing: 1px}
  .hero h1 {font-size: 42px}
  .hero-description {font-size: 14px}
  .discount-grid {grid-template-columns: 1fr}
  .offers {padding: 80px 0}
  .diya-row {gap: 20px; margin-top: 10px;}
  .diya {width: 42px; height: 20px}
  .whatsapp-float {width: 52px; height: 52px; font-size: 26px; bottom: 20px; right: 20px;}
}

    animation
