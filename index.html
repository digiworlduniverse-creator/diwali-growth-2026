<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d20">
<title>Diwali Game Badlo | DiGi World Universe</title>
<meta name="description" content="Celebrate Diwali with exclusive digital marketing and AI automation offers from DiGi World Universe. Limited to 10 clients for one month.">

<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
  --navy:#080d20;
  --navy2:#101a35;
  --gold:#ffd477;
  --gold2:#ffac36;
  --orange:#ff752e;
  --white:#fffaf0;
  --muted:#b9bfd0;
}
* {box-sizing:border-box;margin:0;padding:0}
html {scroll-behavior:smooth}
body {
  background:var(--navy);
  color:var(--white);
  font-family:'Outfit',sans-serif;
  overflow-x:hidden;
}
a {text-decoration:none;color:inherit}
.container {width:min(1200px,91%);margin:auto}

/* HERO SECTION */
.hero {
  min-height:100vh;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(ellipse at 50% 70%,rgba(255,130,34,.15),transparent 50%),
    radial-gradient(ellipse at 90% 10%,rgba(96,71,180,.25),transparent 35%),
    linear-gradient(145deg,#080d20,#121b36 55%,#080d20);
}
.hero:before {
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  opacity:.22;
  background-image:
    linear-gradient(rgba(255,215,130,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,215,130,.06) 1px,transparent 1px);
  background-size:65px 65px;
}
.glow {
  position:absolute;
  width:450px;height:450px;
  border-radius:50%;
  filter:blur(100px);
  pointer-events:none;
}
.glow.one {background:#ff8a25;opacity:.13;top:25%;left:-200px}
.glow.two {background:#744bff;opacity:.18;right:-200px;top:10%}

/* PARTICLES */
.particles {
  position:absolute;
  inset:0;
  pointer-events:none;
  overflow:hidden;
}
.particle {
  position:absolute;
  width:3px;height:3px;
  background:#ffdb91;
  border-radius:50%;
  box-shadow:0 0 12px 3px rgba(255,190,80,.5);
  animation:rise linear infinite;
}
@keyframes rise {
  0% {transform:translateY(100vh) scale(.5);opacity:0}
  15% {opacity:1}
  85% {opacity:.7}
  100% {transform:translateY(-100px) scale(1.5);opacity:0}
}

/* NAVBAR */
.navbar {
  position:relative;
  z-index:5;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:22px 0;
}
.logo-link {
  display: flex;
  align-items: center;
}
.logo-img {
  height: 55px;
  width: auto;
  object-fit: contain;
}

.nav-tag {
  padding: 10px 17px;
  border: 1px solid rgba(255, 210, 120, 0.4);
  border-radius: 30px;
  color: var(--gold);
  font-size: 11px;
  letter-spacing: 2px;
  background: rgba(255, 172, 54, 0.05);
}

/* HERO GRID CONTAINER */
.hero-content-wrapper {
  display: grid;
  grid-template-columns: 0.9fr 1.1fr;
  align-items: center;
  gap: 40px;
  padding: 40px 0 65px;
  position: relative;
  z-index: 2;
}

/* CHARACTER COLUMN (LEFT) */
.hero-visual-col {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
}
.character-card {
  position: relative;
  width: 100%;
  max-width: 400px;
  border-radius: 24px;
  background: linear-gradient(145deg, #17223e, #0c142a);
  border: 1px solid rgba(255, 202, 111, 0.3);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
  overflow: hidden;
  padding: 12px;
}
.character-image-wrapper {
  width: 100%;
  height: 440px;
  border-radius: 16px;
  overflow: hidden;
  position: relative;
  background: radial-gradient(circle at center, #1b294a 0%, #080d20 100%);
}
.character-image-wrapper img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
}

/* TEXT COLUMN (RIGHT) */
.hero-text-col {
  text-align: left;
}

.eyebrow {
  color: var(--gold);
  font-size: 12px;
  letter-spacing: 4px;
  font-weight: 700;
  text-transform: uppercase;
  margin-bottom: 15px;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(40px, 5.5vw, 75px);
  line-height: 1.05;
  margin: 15px 0 20px;
  text-shadow: 0 5px 40px rgba(255, 172, 54, 0.15);
}

.hero h1 span {
  display: block;
  background: linear-gradient(90deg, #fff1c4, #ffba4d, #fff0b2);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero-description {
  color: #c8cede;
  font-size: 16px;
  line-height: 1.7;
  margin-bottom: 25px;
}

.limited {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 25px;
  padding: 10px 18px;
  border: 1px solid rgba(255, 196, 90, 0.55);
  border-radius: 40px;
  background: rgba(255, 166, 48, 0.09);
  color: #ffdb96;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 1px;
}
.limited i {
  width: 8px;height: 8px;
  background: #ff9b3d;
  border-radius: 50%;
  box-shadow: 0 0 12px #ff9b3d;
}

.hero-buttons {
  display: flex;
  gap: 15px;
  flex-wrap: wrap;
}

.btn {
  padding: 15px 27px;
  border-radius: 40px;
  font-size: 13px;
  font-weight: 800;
  transition: .3s;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.btn-gold {
  color: #241403;
  background: linear-gradient(110deg,#ffe6a0,#ffae35);
  box-shadow: 0 10px 35px rgba(255,163,48,.2);
}
.btn-outline {
  border: 1px solid rgba(255,215,140,.5);
  color: #ffe3ae;
}
.btn:hover {transform: translateY(-4px); filter: brightness(1.1)}

/* DIYA VISUALS */
.diya-row {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: end;
  gap: clamp(25px, 6vw, 70px);
  margin: 35px auto 20px;
  grid-column: 1 / -1;
}
.diya {
  width: 55px;
  height: 25px;
  position: relative;
  background: linear-gradient(180deg,#ffcf76,#a94b16);
  border-radius: 10px 10px 50% 50%;
  box-shadow: 0 12px 35px rgba(255,127,24,.22);
}
.diya:before {
  content: "";
  position: absolute;
  width: 15px; height: 24px;
  left: 50%; top: -23px;
  transform: translateX(-50%);
  border-radius: 50% 50% 45% 45%;
  background: radial-gradient(ellipse at 40% 65%,#fff8b3 0%,#ffb02d 40%,#ff5b18 75%);
  filter: drop-shadow(0 0 12px #ff9b30);
  animation: flame .7s ease-in-out infinite alternate;
}
